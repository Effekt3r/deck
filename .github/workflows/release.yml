# Builds Deck installers for macOS and Windows.
# Push a tag like v0.1.0 (or run manually) → draft GitHub Release with the installers.
# Signing switches on automatically when the secrets below exist; without them
# the builds are unsigned (fine for internal testing).
#
# macOS secrets:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD   (Developer ID Application: Effekt Studios)
#                  APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER (notarisation)
# Windows secrets: WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD   (OV/EV .pfx)
#              or  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (Trusted Signing)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5     # node-gyp for node-pty
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build

      - name: macOS signing material
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          echo "CSC_LINK=$MAC_CERT_P12_BASE64" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Windows signing material
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        env:
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
        shell: bash
        run: echo "CSC_LINK=$WIN_CERT_P12_BASE64" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_CERT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          extra=""
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${{ secrets.APPLE_API_KEY_ID }}" ]; then
            extra="-c.mac.notarize=false"      # unsigned / not notarised build
          fi
          npx electron-builder ${{ matrix.target }} --publish always $extra

      - uses: actions/upload-artifact@v4
        with:
          name: deck-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore
