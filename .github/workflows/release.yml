# Builds Deck installers for macOS and Windows into ONE draft GitHub Release.
# Push a tag like v0.2.0, or run it manually on a branch. The release is named
# after the version in package.json (a pushed tag must match it), and its notes
# are that version's section in CHANGELOG.md. Running again for a version
# replaces its draft; once a version is published, runs for it build nothing
# (publishing a draft creates its tag, which starts this workflow again).
#
# The Mac app (Apple silicon only) must come out signed and notarised: the run
# fails without the macOS secrets and checks the app before drafting (`npm run
# dist:mac` builds unsigned locally). Windows signing switches on once its
# secrets exist.
#
# macOS secrets:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD
#                  (Developer ID Application: Effekt Studios Pty Ltd (QT63GS3Q44))
#                  APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER (notarisation)
# Windows secrets: WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD   (OV/EV .pfx)
#              or  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (Trusted Signing)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two runs for one version would race for its draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json's version $version"
            exit 1
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$version\" and (.draft | not)) | .id")
          if [ -n "$published" ]; then
            echo "::notice::v$version is published already; nothing to build (raise the version for a new release)"
          fi
          # An existing tag fixes the release's commit: GitHub ignores --target then,
          # and the release would ship this run's build under another commit's tag.
          # (gh api exits non-zero for a missing tag; its error text isn't used.)
          if [ -z "$published" ] && [ "$GITHUB_REF_TYPE" != tag ] &&
             tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/v$version" --jq .sha 2>/dev/null) &&
             [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag v$version is at ${tag_sha:0:7}, this run is ${GITHUB_SHA:0:7}: run on the tag, move the tag, or raise the version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$([ -n "$published" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # macos-14 images retire 2026-11-02
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60     # a Mac build with notarisation takes ~10 min; the default is 6 h
    env:
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 != '' }}
    steps:
      - name: Mac signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Mac releases are signed and notarised; missing secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5     # node-gyp for node-pty
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck   # the electron-vite build doesn't typecheck
      - run: npm test
      - run: npm run build

      - name: macOS signing material
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          echo "CSC_LINK=$MAC_CERT_P12_BASE64" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Windows signing material
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        env:
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
        shell: bash
        run: echo "CSC_LINK=$WIN_CERT_P12_BASE64" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        # Only the release job publishes, once both platforms have built: two
        # builders publishing at once each made their own draft. The update
        # files (latest*.yml) are written either way.
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Check the Mac app (signed, notarised, Apple silicon only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=dist/mac-arm64/Deck.app
          codesign --verify --deep --strict "$app"
          info=$(codesign -dv --verbose=2 "$app" 2>&1)
          grep -E '^(Authority=Developer ID Application|TeamIdentifier)' <<<"$info"
          grep -q '^TeamIdentifier=QT63GS3Q44$' <<<"$info" || { echo "::error::$app isn't signed by team QT63GS3Q44"; exit 1; }
          # Apple silicon only: no file in the app may be Intel-only code.
          intel=""
          while IFS= read -r -d '' f; do
            archs=$(lipo -archs "$f" 2>/dev/null) || continue   # not Mach-O
            case " $archs " in *" arm64 "* | *" arm64e "*) ;; *) intel+="${f#"$app"/} [$archs]"$'\n' ;; esac
          done < <(find "$app" -type f -print0)
          if [ -n "$intel" ]; then
            echo "::error::Intel-only code in the Apple silicon app:"
            printf '%s' "$intel"
            exit 1
          fi
          # The stapled notarisation ticket. Validating it asks Apple's servers,
          # which a runner sometimes can't reach ("network connection was lost",
          # error 68), so it runs last and gets three tries.
          for attempt in 1 2 3; do
            if xcrun stapler validate "$app"; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::the notarisation ticket didn't validate"; exit 1; fi
            echo "::warning::stapler validate failed (attempt $attempt); trying again"
            sleep $((attempt * 20))
          done

      - uses: actions/upload-artifact@v4
        with:
          name: deck-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 3       # the release job copies them into the release
          compression-level: 0    # dmg, zip and exe are compressed already

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deck-*
          path: dist
          merge-multiple: true
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          for f in "Deck-$VERSION-mac-arm64.dmg" "Deck-$VERSION-mac-arm64.zip" \
                   "Deck-$VERSION-win-x64.exe" latest-mac.yml latest.yml; do
            [ -f "dist/$f" ] || { echo "::error::the builds didn't produce $f"; exit 1; }
          done

          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"")
          if grep -q ' false$' <<<"$releases"; then
            echo "::error::$tag was published while this run built; its files stay as they are"
            exit 1
          fi
          # Drafts of this version from earlier runs make way for this one. If a
          # step below fails, this version's draft is missing or partial: don't
          # publish it; re-run the failed job (the artifacts are kept 3 days).
          while read -r id draft; do
            [ "$draft" = true ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "replaced the earlier draft $id"
          done <<<"$releases"

          # This version's section of CHANGELOG.md ("## 0.2.0 — date" up to the next "## ").
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" '/^## / { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > "$notes"
          if grep -q '[^[:space:]]' "$notes"; then
            notes_args=(--notes-file "$notes")
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using GitHub's generated notes"
            notes_args=(--generate-notes)
          fi

          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Deck $VERSION" \
            "${notes_args[@]}" dist/*
          echo "### Draft: Deck $VERSION" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*; do
            echo "- ${f#dist/} ($(( $(stat -c %s "$f") / 1048576 )) MB)"
          done >> "$GITHUB_STEP_SUMMARY"
